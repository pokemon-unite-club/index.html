*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background:var(--bg);padding:28px clamp(16px,4vw,48px) 42px;border-radius:0}.wrap{max-width:1100px;margin:auto}

function setRankOptions(){const el=document.getElementById('newRank');el.innerHTML='<option value="7">🏆 レジェンド</option><option value="6">👑 マスター</option><option value="5">🟠 エキスパート</option><option value="4">🟣 エリート</option><option value="3">🔵 ハイパー</option><option value="2">🟢 スーパー</option><option value="1">⚪ ビギナー</option>'}
function renderMembers(){const el=document.getElementById('memberList');el.innerHTML=members.map(function(m,i){return '<span class="chip">'+(m.spectator?'👀 ':'')+rankEmoji[m.rank]+' '+esc(m.name)+' <b>'+(m.spectator?'観戦者':rankNames[m.rank])+'</b><button class="removeMember" data-i="'+i+'">×</button><button class="toggleSpectator" data-i="'+i+'">'+(m.spectator?'▶ 参加':'👀 観戦')+'</button></span>'}).join('');const active=members.filter(function(m){return !m.spectator}).length;const spectators=members.filter(function(m){return m.spectator}).length;document.getElementById('memberHint').innerHTML='<span class="count">'+active+'人</span>参加'+(spectators?'・<span class="count">'+spectators+'人</span>観戦':'')+'（観戦者はチーム編成から除外）';el.querySelectorAll('.removeMember').forEach(function(b){b.onclick=function(){members.splice(+b.dataset.i,1);save();renderMembers()}});el.querySelectorAll('.toggleSpectator').forEach(function(b){b.onclick=function(){members[+b.dataset.i].spectator=!members[+b.dataset.i].spectator;teams=[];teamPokes=[];save();renderMembers();document.getElementById('teamResults').className='empty';document.getElementById('teamResults').textContent='ここにチーム分けが表示されます。';updateDiscord()}})}
function addMember(){const name=document.getElementById('newName').value.trim();const rank=+document.getElementById('newRank').value;const spectator=document.getElementById('newSpectator').checked;if(!name)return;if(members.some(function(m){return m.name===name})){document.getElementById('appStatus').textContent='同じ名前は登録できません。';return}members.push({name:name,rank:rank,spectator:spectator});save();document.getElementById('newName').value='';document.getElementById('newSpectator').checked=false;renderMembers();document.getElementById('appStatus').textContent=name+(spectator?'を観戦者として登録しました。':'を参加者として登録しました。')}
function makeTeams(){const k=+document.getElementById('teamCount').value;const players=members.filter(function(m){return !m.spectator});if(players.length<k){document.getElementById('appStatus').textContent=k+'チームにするには最低'+k+'人の参加者が必要です。';return null}let best=null,bestScore=Infinity;for(let trial=0;trial<4000;trial++){const order=shuffle(players);const ts=Array.from({length:k},function(){return []});order.forEach(function(m,i){ts[i%k].push(Object.assign({},m,{role:'未選択',poke:''}))});const sums=ts.map(function(t){return t.reduce(function(a,m){return a+m.rank},0)});const mean=sums.reduce(function(a,b){return a+b},0)/k;const spread=Math.max.apply(null,sums)-Math.min.apply(null,sums);const variance=sums.reduce(function(a,b){return a+Math.pow(b-mean,2)},0)/k;const sizes=ts.map(function(t){return t.length});const sizePenalty=Math.max.apply(null,sizes)-Math.min.apply(null,sizes);const score=document.getElementById('balanceMode').value==='random'?Math.random():spread*25+variance*4+sizePenalty*8;if(score<bestScore){bestScore=score;best=ts}}return best}
function roleOptions(v){return roles.map(function(r){return '<option '+(r===v?'selected':'')+'>'+r+'</option>'}).join('')}
function pokeOptions(v,choices){return '<option value="">ポケモンを選択</option>'+choices.map(function(p){return '<option '+(p===v?'selected':'')+'>'+p+'</option>'}).join('')}
function renderTeams(){const box=document.getElementById('teamResults');if(!teams.length)return;box.className='';box.innerHTML='<div class="teams">'+teams.map(function(t,ti){const choices=teamPokes[ti]||[];return '<article class="team"><div class="team-title"><span>TEAM '+String.fromCharCode(65+ti)+'</span><small>'+t.length+'人</small></div><div class="slots">'+t.map(function(m,pi){return '<div class="slot"><span class="num">'+(pi+1)+'</span><div class="player">'+esc(m.name)+'</div></div>'}).join('')+'</div><div class="candidate-list" style="padding:12px 14px;border-top:1px solid var(--border)"><strong>🎲 ポケモン候補5体</strong><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px">'+choices.map(function(p){return '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px;text-align:center"><img src="'+pokemonImage(p)+'" alt="'+esc(p)+'" style="width:58px;height:58px;object-fit:contain;display:block;margin:auto"><div style="font-size:11px;font-weight:800;margin-top:4px">'+esc(p)+'</div></div>'}).join('')+'</div></div></article>'}).join('')+'</div>';updateDiscord()}
function draw(){try{const next=makeTeams();if(!next)return;const bans=new Set((document.getElementById('banPokemon')?.value||'').split(/[,、\n]/).map(function(x){return x.trim().replace(/\s+/g,'')}).filter(Boolean));const candidates=pokemons.filter(function(p){return !bans.has(p.replace(/\s+/g,''))});if(candidates.length<5){document.getElementById('appStatus').textContent='BANを除くポケモン候補が5体未満です。BANを減らしてください。';return}teams=next;teamPokes=teams.map(function(){return shuffle(candidates).slice(0,5)});renderTeams();document.getElementById('appStatus').textContent=teams.length+'チームを作成し、BANを除外した候補ポケモン5体を各チームに抽選しました。'}catch(e){document.getElementById('appStatus').textContent='チーム分け中にエラーが発生しました。ページを更新してもう一度試してください。';console.error(e)}}
function discord(){let s='🎮 **ユナイト部 カスタム交流会**\n';teams.forEach(function(t,i){const choices=teamPokes[i]||[];s+='\n## '+(i===0?'🅰️':i===1?'🅱️':i===2?'🅲️':'🅳️')+' TEAM '+String.fromCharCode(65+i)+'\n';t.forEach(function(m){s+='・**'+m.name+'**\n'});s+='\n🎲 **ポケモン候補5体**\n'+choices.map(function(p){return '・'+p}).join('\n')+'\n'});s+='\n📝 各チームで候補5体から相談して選択！';return s}
function updateDiscord(){const el=document.getElementById('discordText');if(!teams.length){el.textContent='ここに結果が表示されます。';return}el.innerHTML=teams.map(function(t,i){const choices=teamPokes[i]||[];return '<div style="margin-bottom:18px"><div style="font-weight:900;font-size:15px;margin-bottom:8px">TEAM '+String.fromCharCode(65+i)+'</div><div style="margin-bottom:8px">'+t.map(function(m){return '<span style="display:inline-block;background:#242832;border-radius:8px;padding:5px 8px;margin:2px">'+esc(m.name)+'</span>'}).join('')+'</div><div style="font-weight:800;margin-bottom:6px">🎲 ポケモン候補</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">'+choices.map(function(p){return '<div style="background:#242832;border-radius:9px;padding:6px;text-align:center"><img src="'+pokemonImage(p)+'" alt="'+esc(p)+'" style="width:62px;height:62px;object-fit:contain;display:block;margin:auto"><div style="font-size:11px;font-weight:800">'+esc(p)+'</div></div>'}).join('')+'</div></div>'}).join('')}
function init(){ui();setRankOptions();renderMembers();document.getElementById('addMember').onclick=addMember;document.getElementById('newName').onkeydown=function(e){if(e.key==='Enter')addMember()};document.getElementById('drawTeams').onclick=draw;document.getElementById('rerollTeams').onclick=draw;document.getElementById('copyDiscord').onclick=function(){if(!teams.length)return; navigator.clipboard.writeText(discord()).then(function(){document.getElementById('appStatus').textContent='Discord用の結果をコピーしました。'})};document.getElementById('clearMembers').onclick=function(){if(confirm('登録メンバーをすべて消去しますか？')){members=[];teams=[];save();renderMembers();document.getElementById('teamResults').className='empty';document.getElementById('teamResults').textContent='ここにチーム分けが表示されます。';updateDiscord()}}}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
})();
</script>
</div></div></main>
